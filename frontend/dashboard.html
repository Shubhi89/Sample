<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Dashboard | Expense Manager</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="bg-white shadow-sm p-3 mb-4 border-bottom">
        <div class="container-lg d-flex justify-content-between align-items-center">
            <h2 class="h4 mb-0">
                <i class="fas fa-wallet me-2"></i>Expense Manager
            </h2>
            <button id="logoutBtn" class="btn btn-outline-danger">
                <i class="fas fa-sign-out-alt me-1"></i>Logout
            </button>
        </div>
    </header>

    <div class="container-lg">
        <div class="row">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="h5 mb-3"><i class="fas fa-plus-circle me-2"></i>Add/Edit Expense</h3>
                        <form id="expenseForm">
                            <div class="mb-3">
                                <label for="title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="title" placeholder="Expense Title" required>
                            </div>
                            <div class="mb-3">
                                <label for="amount" class="form-label">Amount (₹)</label>
                                <input type="number" class="form-control" id="amount" placeholder="Amount (₹)" required>
                            </div>
                            <div class="mb-3">
                                <label for="category" class="form-label">Category</label>
                                <input type="text" class="form-control" id="category" placeholder="Category" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Add Expense</button>
                            </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="h5 mb-3"><i class="fas fa-list-ul me-2"></i>Your Expenses</h3>
                        <ul id="expenseItems" class="list-group list-group-flush">
                            </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
